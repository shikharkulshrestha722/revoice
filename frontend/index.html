<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ReVoice</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>ReVoice</h1>
  <p class="subtitle">Head-controlled laser input &rarr; GenAI composition &rarr; cloned voice output</p>

  <!-- USER SWITCHER (caregiver uses the mouse here) -->
  <div class="profile-bar">
    <span class="profile-label">User:</span>
    <div id="profileButtons" class="profile-buttons"></div>
    <button id="addUserBtn">+ Add user</button>
    <button id="deleteUserBtn" class="danger" hidden>Delete user</button>
    <span id="profileStatus" class="hint"></span>
  </div>

  <!-- ADD USER PANEL -->
  <div id="addUserPanel" class="panel add-user" hidden>
    <h2>Add user</h2>
    <label for="newName">Name:</label>
    <input id="newName" type="text" maxlength="60" placeholder="e.g. Mr Sharma" />

    <fieldset>
      <legend>Voice</legend>
      <label><input type="radio" name="voiceType" value="cloned" checked />
        Record my voice (clone it)</label>
      <label><input type="radio" name="voiceType" value="stock" />
        Use a stock voice (for someone with no healthy voice left to record)</label>
    </fieldset>

    <div id="stockRow" hidden>
      <label for="stockSpeaker">Stock voice:</label>
      <select id="stockSpeaker"></select>
      <span id="stockSource" class="hint"></span>
    </div>

    <label id="consentRow" class="consent">
      <input type="checkbox" id="consent" />
      I agree that my voice may be recorded and cloned for ReVoice.
      I can ask for it to be deleted at any time.
    </label>

    <div>
      <button id="createUserBtn">Create user</button>
      <button id="cancelAddBtn">Cancel</button>
    </div>
    <p id="addUserStatus" class="hint"></p>
  </div>

  <div class="main-layout">

    <!-- LEFT: camera + letter grid -->
    <div class="panel">
      <h2>1. Point &amp; Select</h2>
      <div class="camera-wrap">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls-row">
        <button id="startCamBtn">Start Camera</button>
        <label for="trackMode">Tracking:</label>
        <select id="trackMode">
          <option value="finger">Finger (index fingertip)</option>
          <option value="laser">Laser pointer (red dot)</option>
        </select>
      </div>
      <p id="trackStatus" class="hint">Click Start Camera to begin.</p>
      <p class="hint">Hold the pointer still on a letter until the green ring fills up.</p>
    </div>

    <!-- RIGHT: composed text + voice controls -->
    <div class="panel">
      <h2>2. Composed Text</h2>
      <div id="composedText" class="composed-box">&nbsp;</div>
      <button id="clearBtn">Clear</button>

      <h2>3. Voice Bank</h2>
      <label for="emotion">Emotion tag:</label>
      <select id="emotion">
        <option value="neutral">Neutral</option>
        <option value="happy">Happy</option>
        <option value="urgent">Urgent</option>
        <option value="tender">Tender</option>
      </select>
      <!-- hidden for stock-voice users: they have nothing to record -->
      <span id="recordControls">
        <button id="recordBtn">Record Voice Clip (up to 20s)</button>
        <span id="recordStatus"></span>
      </span>
      <p id="stockNote" class="hint" hidden></p>

      <h2>4. Speak</h2>
      <label for="engine">Voice engine:</label>
      <select id="engine">
        <option value="xtts">XTTS-v2</option>
        <option value="f5">F5-TTS</option>
        <option value="both">Compare both</option>
      </select>
      <button id="speakBtn">Generate &amp; Speak</button>

      <!-- single engine: one player -->
      <audio id="outputAudio" controls></audio>

      <!-- "Compare both": one labelled player per engine -->
      <div id="compareBox" class="compare-box" hidden>
        <div class="compare-item">
          <strong>XTTS-v2</strong> <span id="timeXtts" class="compare-time"></span>
          <audio id="audioXtts" controls></audio>
        </div>
        <div class="compare-item">
          <strong>F5-TTS</strong> <span id="timeF5" class="compare-time"></span>
          <audio id="audioF5" controls></audio>
        </div>
      </div>
      <p id="speakStatus"></p>
    </div>

  </div>

  <script type="module" src="app.js"></script>

  <!-- Safety check: tells you if app.js failed to load -->
  <script>
    (function () {
      var status = document.getElementById("trackStatus");
      if (location.protocol === "file:") {
        status.textContent = "Open this page through the server: run the backend, then go to http://localhost:8000";
        status.style.color = "#c0392b";
        return;
      }
      setTimeout(function () {
        if (!window.__revoiceLoaded) {
          status.textContent = "app.js failed to load. Press F12 → Console to see the error, and make sure you opened http://localhost:8000";
          status.style.color = "#c0392b";
        }
      }, 3000);
    })();
  </script>
</body>
</html>
